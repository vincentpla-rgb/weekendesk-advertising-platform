* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-body); font-size: var(--text-md); color: var(--foreground-primary); background: var(--background-secondary); line-height: 1.4; }

.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100%; }
.side { background: var(--background-primary); border-right: 1px solid var(--border-primary); padding: var(--padding-lg) var(--padding-md); position: sticky; top: 0; height: 100vh; overflow: auto; }
.side h1 { font-family: var(--font-heading); font-weight: 800; font-size: var(--heading-md); letter-spacing: -0.5px; margin: 0 0 var(--gap-sm); }
.side p.sub { margin: 0 0 var(--gap-2xl); color: var(--foreground-secondary); font-size: var(--text-sm); }
.nav { display: flex; flex-direction: column; gap: var(--gap-sm); }
.nav button { text-align: left; font-family: var(--font-body); font-size: var(--text-sm); color: var(--foreground-primary); background: var(--background-primary); border: 1px solid var(--border-primary); border-radius: var(--radius-sm); padding: var(--padding-md); cursor: pointer; display: flex; gap: var(--gap-md); align-items: flex-start; transition: border-color var(--transition-fast) ease, background var(--transition-fast) ease; }
.nav button:hover { border-color: var(--foreground-primary); }
.nav button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.nav button[aria-current="true"] { border-color: var(--foreground-primary); background: var(--background-secondary); }
.nav .num { font-family: var(--font-heading); font-weight: 800; font-size: var(--heading-md); line-height: 1; min-width: 20px; }
.nav .t { display: block; font-weight: 600; margin-bottom: var(--gap-xs); }
.badge-sm { display: inline-flex; align-items: center; border-radius: var(--radius-sm); padding: 2px var(--padding-sm); font-size: var(--text-xs); }
.badge--client { background: var(--info-background); color: var(--info-foreground); }
.badge--internal { background: var(--warning-background); color: var(--warning-foreground); }

.main { padding: var(--padding-lg) var(--padding-xl) var(--gap-5xl); min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--gap-lg); align-items: center; margin-bottom: var(--gap-2xl); }
.seg { display: inline-flex; border: 1px solid var(--border-primary); border-radius: var(--radius-sm); overflow: hidden; background: var(--background-primary); }
.seg button { font-family: var(--font-body); font-size: var(--text-sm); border: 0; background: transparent; color: var(--foreground-secondary); padding: 10px 14px; cursor: pointer; border-right: 1px solid var(--border-secondary); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--foreground-primary); color: var(--foreground-inverse); }
.seg button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
.tlabel { font-size: var(--text-xs); color: var(--foreground-tertiary); margin-right: var(--gap-xs); }

.env { background: var(--background-primary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); padding: var(--padding-md) var(--padding-lg); margin-bottom: var(--gap-2xl); max-width: 760px; }
.env .subj { font-family: var(--font-heading); font-weight: 700; font-size: 18px; margin: 0 0 var(--gap-xs); }
.env .pre { color: var(--foreground-tertiary); font-size: var(--text-sm); margin: 0 0 var(--gap-lg); }
.env dl { display: grid; grid-template-columns: 96px 1fr; gap: var(--gap-xs) var(--gap-lg); margin: 0; font-size: var(--text-sm); }
.env dt { color: var(--foreground-tertiary); }
.env dd { margin: 0; color: var(--foreground-primary); }
.note { max-width: 760px; margin: 0 0 var(--gap-lg); padding: var(--padding-md); border-radius: var(--radius-sm); background: var(--info-background); font-size: var(--text-sm); }
.note.warn { background: var(--warning-background); }

.stage { display: flex; justify-content: center; }
.frame { background: var(--background-primary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); overflow: hidden; transition: width var(--transition-slow) ease; }
.frame iframe { display: block; width: 100%; border: 0; }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border-primary); }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { min-width: 220px; }
  .main { padding: var(--padding-lg) var(--padding-md) var(--gap-5xl); }
}

    <section class="env" id="env" aria-live="polite"></section>

  </main>
</div>

  counter_received:{to:'contacto del cliente', cc:'creador del presupuesto', bcc:'contracting@weekendesk.fr', reply:'creador del presupuesto', att:'—'},
  reminder:        {to:'contacto del cliente', cc:'creador del presupuesto', bcc:'contracting@weekendesk.fr', reply:'creador del presupuesto', att:'— · se envía si no hay respuesta (p. ej. día 10 de 14)'},
  expired_am:      {to:'creador del presupuesto', cc:'—', bcc:'—', reply:'no-reply', att:'—'},
  blocked_am:      {to:'creador del presupuesto', cc:'—', bcc:'—', reply:'no-reply', att:'—'},
  new_version:     {to:'contacto del cliente', cc:'creador del presupuesto', bcc:'contracting@weekendesk.fr', reply:'creador del presupuesto', att:'—'},
  opened_am:       {to:'creador del presupuesto', cc:'—', bcc:'—', reply:'no-reply', att:'— · solo la primera apertura'},
  counter_rejected:{to:'contacto del cliente', cc:'creador del presupuesto', bcc:'contracting@weekendesk.fr', reply:'creador del presupuesto', att:'—'}
};
const FROM = 'Weekendesk Advertising <advertising@weekendesk.fr> (remitente propuesto · pendiente DNS)';

/* ── Utilidades ── */
const tpl = (s, d) => String(s).replace(/\{\{(\w+)\}\}/g, (_, k) => (d[k] !== undefined ? d[k] : '{{'+k+'}}'));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = (n, lang, sign) => new Intl.NumberFormat(LOCALE[lang], {style:'currency', currency:'EUR', maximumFractionDigits:0, useGrouping:'always', signDisplay: sign ? 'exceptZero' : 'auto'}).format(n);
const pct = (r, lang) => new Intl.NumberFormat(LOCALE[lang], {style:'percent', minimumFractionDigits:1, maximumFractionDigits:1}).format(r);
const pts = (r, lang, unit) => new Intl.NumberFormat(LOCALE[lang], {minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:'exceptZero'}).format(r*100) + ' ' + unit;
const dateL = (d, lang) => new Intl.DateTimeFormat(LOCALE[lang], {dateStyle:'long'}).format(d);

/* ── Bloques email-safe (tablas + estilos inline) ── */
const P = 'font-family:'+FB+';';
const btn = (label, href, kind) => kind === 'primary'
  ? `<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="btn"><tr><td align="center" bgcolor="${C.red}" style="border-radius:8px;"><a href="${href}" style="display:inline-block;padding:16px 20px;${P}font-size:16px;font-weight:700;line-height:1.2;color:#FFFFFF;text-decoration:none;border-radius:8px;">${label}</a></td></tr></table>`
  : `<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="btn"><tr><td align="center" bgcolor="${C.bg1}" style="border-radius:8px;border:1px solid ${C.bd};"><a href="${href}" style="display:inline-block;padding:16px 20px;${P}font-size:16px;font-weight:400;line-height:1.2;color:${C.fg1};text-decoration:none;border-radius:8px;">${label}</a></td></tr></table>`;
const h1 = t => `<h1 style="margin:0 0 16px;font-family:${FH};font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-0.5px;color:${C.fg1};">${t}</h1>`;
const para = (t, extra) => `<p style="margin:0 0 24px;${P}font-size:16px;line-height:1.5;color:${C.fg1};${extra||''}">${t}</p>`;
const small = t => `<p style="margin:24px 0 0;${P}font-size:14px;line-height:1.5;color:${C.fg2};">${t}</p>`;
const sect = t => `<p style="margin:0 0 12px;font-family:${FH};font-weight:700;font-size:18px;line-height:1.22;color:${C.fg1};">${t}</p>`;
const gap = n => `<div style="height:${n}px;line-height:${n}px;font-size:0;">&nbsp;</div>`;
const pill = (ok, text, onTint) => `<span style="display:inline-block;padding:4px 8px;border-radius:8px;${P}font-size:12px;line-height:1.3;background:${onTint?C.bg1:(ok?C.okBg:C.noBg)};color:${ok?C.ok:C.no};font-weight:600;">${text}</span>`;

const rowsCard = rows => {
  const tr = rows.map(([l, v], i) => `<tr><td style="padding:12px 16px;${i<rows.length-1?`border-bottom:1px solid ${C.bd2};`:''}${P}font-size:14px;line-height:1.4;color:${C.fg3};width:40%;vertical-align:top;">${l}</td><td style="padding:12px 16px;${i<rows.length-1?`border-bottom:1px solid ${C.bd2};`:''}${P}font-size:14px;line-height:1.4;color:${C.fg1};font-weight:600;vertical-align:top;">${v}</td></tr>`).join('');
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid ${C.bd};border-radius:16px;border-collapse:separate;border-spacing:0;">${tr}</table>`;
};
const numbered = items => `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">${items.map((t,i)=>`<tr><td width="36" valign="top" style="padding:0 0 12px;"><div style="width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;background:${C.bg2};font-family:${FH};font-weight:800;font-size:13px;color:${C.fg1};">${i+1}</div></td><td valign="top" style="padding:0 0 12px;${P}font-size:16px;line-height:1.5;color:${C.fg1};">${t}</td></tr>`).join('')}</table>`;
const checks = items => `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">${items.map(t=>`<tr><td width="28" valign="top" style="padding:0 0 12px;${P}font-size:16px;line-height:1.5;color:${C.ok};font-weight:700;">&#10003;</td><td valign="top" style="padding:0 0 12px;${P}font-size:16px;line-height:1.5;color:${C.fg1};">${t}</td></tr>`).join('')}</table>`;
const attach = (file, desc) => `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid ${C.bd};border-radius:8px;border-collapse:separate;border-spacing:0;"><tr><td width="56" style="padding:12px 0 12px 12px;"><div style="width:40px;height:40px;line-height:40px;text-align:center;border-radius:8px;background:${C.bg2};${P}font-size:12px;font-weight:700;color:${C.fg1};">PDF</div></td><td style="padding:12px 16px 12px 12px;${P}"><div style="font-size:14px;font-weight:600;color:${C.fg1};line-height:1.3;">${file}</div><div style="font-size:12px;color:${C.fg3};line-height:1.3;margin-top:2px;">${desc}</div></td></tr></table>`;
const quote = (label, text, note) => `<p style="margin:0 0 4px;${P}font-size:12px;color:${C.fg3};">${label}</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-left:3px solid ${C.navy};padding:4px 0 4px 16px;${P}font-size:16px;line-height:1.5;color:${C.fg1};">${esc(text)}${note?`<div style="margin-top:8px;font-size:14px;color:${C.fg2};">${esc(note)}</div>`:''}</td></tr></table>`;

/* ── Cálculos de rentabilidad ── */
function money_calc(scen) {
  const orig = {sale:SAMPLE.total, cost:SAMPLE.cost};
  const ctr = {sale: scen === 'ok' ? 5400 : 4800, cost: SAMPLE.cost};
  [orig, ctr].forEach(x => { x.margin = x.sale - x.cost; x.mp = x.margin / x.sale; });
  return {orig, ctr, minPrice: SAMPLE.cost / 0.5};
}

/* ── Render principal ── */
function render(key, lang, scen) {
  const email = COPY.emails[key];
  const usedLang = email.langs[lang] ? lang : 'en';
  const c = email.langs[usedLang];
  const L = COPY.labels[usedLang];
  const m = money_calc(scen);
  const cur = m.ctr;
  const showCtr = key === 'counter_am';
  const base = showCtr ? cur : m.orig;
  const d = {
    firstName: email.audience === 'internal' ? (SAMPLE.amFirst[usedLang] || 'Rémi') : SAMPLE.clientFirst,
    clientCompany: SAMPLE.clientCompany, proposalNumber: SAMPLE.proposalNumber,
    creatorName: SAMPLE.creator[usedLang], inviterName: SAMPLE.inviterName,
    validUntil: dateL(SAMPLE.valid, usedLang), optionName: SAMPLE.option[usedLang],
    total: money(m.orig.sale, usedLang), counterTotal: money(m.ctr.sale, usedLang),
    marginPct: pct(base.mp, usedLang), minPrice: money(m.minPrice, usedLang),
    supportName: (SAMPLE.support[usedLang] || SAMPLE.support.en)
  };
  const T = s => tpl(s, d);
  const inner = [];
  const isClient = email.audience === 'client';
  const cardRow = (l, v) => [l, v];

  inner.push(h1(T(c.title)));
  inner.push(para(T(c.intro)));

  if (key === 'invite') {
    inner.push(checks(c.points.map(T)));
    inner.push(gap(4));
    inner.push(rowsCard([[L.role, 'Advertising Manager'], [L.invitedBy, d.inviterName]]));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  if (key === 'proposal') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.sentBy, d.creatorName], [L.validUntil, d.validUntil]]));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  if (key === 'accepted_client' || key === 'counter_accepted') {
    const amount = key === 'counter_accepted' ? m.ctr.sale : m.orig.sale;
    inner.push(rowsCard([
      [L.proposal, d.proposalNumber], [L.option, d.optionName], [L.markets, SAMPLE.markets],
      [key === 'counter_accepted' ? L.agreedAmount : L.amount, money(amount, usedLang)], [L.billedTo, SAMPLE.billedTo]
    ]));
    inner.push(gap(24));
    inner.push(sect(T(c.nextTitle)));
    inner.push(numbered(c.steps.map(T)));
    inner.push(gap(4));
    inner.push(attach(T(L.fileClient), T(c.attachDesc)));
    inner.push(small(T(c.note)));
  }

  if (key === 'accepted_am') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.client, d.clientCompany], [L.option, d.optionName], [L.markets, SAMPLE.markets]]));
    inner.push(gap(24));
    inner.push(sect(T(c.finTitle)));
    const ok = m.orig.mp >= 0.5;
    inner.push(rowsCard([
      [L.sale, money(m.orig.sale, usedLang)], [L.cost, money(m.orig.cost, usedLang)],
      [L.margin, money(m.orig.margin, usedLang)],
      [L.marginPct, pct(m.orig.mp, usedLang) + ' &nbsp;' + pill(ok, ok ? L.statusOk : L.statusKo)],
      [L.minMargin, pct(0.5, usedLang).replace(',0','').replace('.0','')]
    ]));
    inner.push(gap(24));
    inner.push(attach(T(L.fileInternal), T(c.attachDesc)));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  if (key === 'counter_am') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.client, d.clientCompany], [L.option, d.optionName]]));
    inner.push(gap(24));
    inner.push(quote(T(c.commentLabel), SAMPLE.comment[usedLang]));
    inner.push(gap(24));
    inner.push(sect(T(c.compTitle)));
    const th = (t, al) => `<td style="padding:10px 12px;${P}font-size:12px;color:${C.fg3};text-align:${al||'right'};border-bottom:1px solid ${C.bd};">${t}</td>`;
    const td = (t, al, b) => `<td style="padding:10px 12px;${P}font-size:14px;line-height:1.3;color:${C.fg1};text-align:${al||'right'};${b?'font-weight:600;':''}border-bottom:1px solid ${C.bd2};">${t}</td>`;
    const dm = (a, b) => (b - a) === 0 ? '—' : money(b - a, usedLang, true);
    const tbl = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid ${C.bd};border-radius:16px;border-collapse:separate;border-spacing:0;">
      <tr>${th('', 'left')}${th(L.original)}${th(L.counter)}${th(L.diff)}</tr>
      <tr>${td(L.sale,'left')}${td(money(m.orig.sale,usedLang))}${td(money(m.ctr.sale,usedLang),'right',1)}${td(dm(m.orig.sale,m.ctr.sale))}</tr>
      <tr>${td(L.cost,'left')}${td(money(m.orig.cost,usedLang))}${td(money(m.ctr.cost,usedLang),'right',1)}${td(dm(m.orig.cost,m.ctr.cost))}</tr>
      <tr>${td(L.margin,'left')}${td(money(m.orig.margin,usedLang))}${td(money(m.ctr.margin,usedLang),'right',1)}${td(dm(m.orig.margin,m.ctr.margin))}</tr>
      <tr>${td(L.marginPct,'left')}${td(pct(m.orig.mp,usedLang))}${td(pct(m.ctr.mp,usedLang),'right',1)}${td(pts(m.ctr.mp - m.orig.mp, usedLang, L.pts))}</tr>
    </table>`;
    inner.push(tbl);
    inner.push(gap(16));
    const ok = m.ctr.mp >= 0.5;
    inner.push(`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="background:${ok?C.okBg:C.noBg};border-radius:8px;padding:16px;${P}font-size:14px;line-height:1.5;color:${C.fg1};">${pill(ok, ok ? L.statusOk : L.statusKo, true)}<div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>${T(ok ? c.verdictOk : c.verdictKo)}</td></tr></table>`);
    inner.push(gap(24));
    inner.push(attach(T(L.fileInternal), T(c.attachDesc)));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  if (key === 'rejected_am') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.client, d.clientCompany], [L.option, d.optionName], [L.amount, money(m.orig.sale, usedLang)]]));
    inner.push(gap(24));
    inner.push(quote(T(c.reasonLabel), COPY.reasons.clientReject.budget[usedLang], SAMPLE.clientNote[usedLang]));
    inner.push(gap(24));
    inner.push(para(T(c.after), 'margin-bottom:24px;'));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  if (key === 'counter_rejected') {
    inner.push(quote(T(c.reasonLabel), COPY.reasons.counterReject.scope[usedLang], SAMPLE.counterNote[usedLang]));
    inner.push(gap(24));
    inner.push(para(T(c.after), 'margin-bottom:24px;'));
    inner.push(btn(T(c.cta), 'mailto:', 'secondary'));
  }

  const rangeFmt = new Intl.DateTimeFormat(LOCALE[usedLang], {dateStyle:'medium'}).formatRange(new Date(2026,11,1), new Date(2026,11,15));
  const standardRows = [[L.proposal, d.proposalNumber], [L.client, d.clientCompany], [L.option, d.optionName], [L.amount, money(m.orig.sale, usedLang)]];

  if (key === 'counter_received') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.option, d.optionName], [L.counter, money(m.ctr.sale, usedLang)]]));
    inner.push(small(T(c.note)));
  }
  if (key === 'reminder') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.validUntil, d.validUntil]]));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }
  if (key === 'new_version') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.version, '2'], [L.validUntil, d.validUntil]]));
    inner.push(gap(24));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }
  if (key === 'expired_am') {
    inner.push(rowsCard(standardRows.concat([[L.validUntil, d.validUntil]])));
    inner.push(gap(24));
    inner.push(para(T(c.after), 'margin-bottom:24px;'));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }
  if (key === 'blocked_am') {
    inner.push(rowsCard([[L.proposal, d.proposalNumber], [L.client, d.clientCompany], [L.support, d.supportName], [L.dates, rangeFmt]]));
    inner.push(gap(24));
    inner.push(para(T(c.after), 'margin-bottom:24px;'));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }
  if (key === 'opened_am') {
    inner.push(rowsCard(standardRows.concat([[L.validUntil, d.validUntil]])));
    inner.push(gap(24));
    inner.push(para(T(c.after), 'margin-bottom:24px;'));
    inner.push(btn(T(c.cta), '#', 'primary'));
    inner.push(small(T(c.note)));
  }

  const badge = email.audience === 'internal'
    ? `<td align="right" style="padding:0;"><span style="display:inline-block;padding:4px 8px;border-radius:8px;background:${C.bg2};${P}font-size:12px;color:${C.fg2};">${L.internal}</span></td>` : '<td></td>';
  const footer = email.audience === 'client' ? T(L.footerClient) : L.footerInternal;

  const html = `<!DOCTYPE html>
<html lang="${usedLang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light">
<title>${esc(T(c.subject))}</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;background:${C.bg2};-webkit-text-size-adjust:100%;}
  .btn{width:auto;}
  @media only screen and (max-width:600px){
    .wrap{width:100% !important;}
    .px{padding-left:24px !important;padding-right:24px !important;}
    .btn{width:100% !important;}
    .btn a{display:block !important;}
    h1{font-size:24px !important;}
  }
</style></head>
<body style="margin:0;padding:0;background:${C.bg2};">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:${C.bg2};">${esc(T(c.preheader))}${'&nbsp;&zwnj;'.repeat(40)}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="${C.bg2}"><tr><td align="center" style="padding:32px 12px;">
  <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:${C.bg1};border:1px solid ${C.bd};border-radius:16px;border-collapse:separate;border-spacing:0;">
    <tr><td class="px" style="padding:32px 40px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="padding:0;"><img src="${LOGO}" alt="Weekendesk" width="143" height="24" style="display:inline-block;vertical-align:middle;border:0;outline:none;height:24px;width:143px;"> <span style="${P}font-size:12px;color:${C.fg3};vertical-align:middle;">&nbsp;advertising</span></td>${badge}
      </tr></table>
    </td></tr>
    <tr><td class="px" style="padding:0 40px 40px;">${inner.join('')}</td></tr>
    <tr><td class="px" style="padding:24px 40px 32px;border-top:1px solid ${C.bd2};${P}font-size:12px;line-height:1.5;color:${C.fg3};">${esc(footer)}<br>${esc(L.legal)}</td></tr>
  </table>
</td></tr></table>
</body></html>`;

  return {html, subject: T(c.subject), pre: T(c.preheader), usedLang, fallback: usedLang !== lang};
}

/* ── UI ── */
const state = {key:'invite', lang:'es', dev:'desktop', scen:'ko'};
const keys = Object.keys(COPY.emails).sort((a,b) => COPY.emails[a].n - COPY.emails[b].n);
const nav = document.getElementById('nav');
keys.forEach(k => {
  const e = COPY.emails[k];
  const b = document.createElement('button');
  b.dataset.k = k;
  b.innerHTML = `<span class="num">${e.n}</span><span><span class="t">${e.title}</span><span class="badge-sm ${e.audience==='client'?'badge--client':'badge--internal'}">${e.audience==='client'?'cliente':'interno'}</span></span>`;
  b.onclick = () => { state.key = k; draw(); };
  nav.appendChild(b);
});
const langSeg = document.getElementById('langSeg');
LANGS.forEach(l => {
  const b = document.createElement('button');
  b.dataset.l = l; b.textContent = LANG_NAME[l];
  b.onclick = () => { state.lang = l; draw(); };
  langSeg.appendChild(b);
});
document.querySelectorAll('#devSeg button').forEach(b => b.onclick = () => { state.dev = b.dataset.d; draw(); });
document.querySelectorAll('#scenSeg button').forEach(b => b.onclick = () => { state.scen = b.dataset.s; draw(); });

const ifr = document.getElementById('ifr');
const frame = document.getElementById('frame');
ifr.addEventListener('load', () => {
  try { ifr.style.height = '0px'; const fit = () => { ifr.style.height = ifr.contentDocument.body.scrollHeight + 'px'; }; fit(); setTimeout(fit, 400); } catch(e) {}
});

function draw() {
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.k === state.key));
  langSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === state.lang));
  document.querySelectorAll('#devSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === state.dev));
  document.querySelectorAll('#scenSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === state.scen));
  document.getElementById('scenWrap').hidden = state.key !== 'counter_am';

  const r = render(state.key, state.lang, state.scen);
  const fb = document.getElementById('fallbackNote');
  fb.hidden = !r.fallback;
  if (r.fallback) fb.textContent = 'Los emails internos solo están previstos en ES · FR · EN (no hay Advertising Managers IT/NL). Se muestra EN.';

  const mt = META[state.key];
  const att = mt.att;
  document.getElementById('env').innerHTML =
    `<p class="subj">${esc(r.subject)}</p><p class="pre">${esc(r.pre)}</p>
     <dl><dt>De</dt><dd>${esc(FROM)}</dd><dt>Para</dt><dd>${esc(mt.to)}</dd><dt>CC</dt><dd>${esc(mt.cc)}</dd><dt>BCC</dt><dd>${esc(mt.bcc)}</dd><dt>Reply-To</dt><dd>${esc(mt.reply)}</dd><dt>Adjunto</dt><dd>${esc(att)}</dd></dl>`;
  frame.style.width = state.dev === 'mobile' ? '375px' : '100%';
  frame.style.maxWidth = state.dev === 'mobile' ? '375px' : '760px';
  ifr.srcdoc = r.html;
}
draw();
</script>
</body>
</html>
